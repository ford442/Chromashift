name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: PR diff guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block dist/ and accidental secrets
        run: bash .github/scripts/check-pr-diff.sh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.sha }}

  web:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    needs: [guard]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      - run: npm run build

  shaders:
    name: Shader validation (naga, glslang)
    runs-on: ubuntu-latest
    needs: [guard]
    timeout-minutes: 15
    env:
      NAGA_VERSION: 29.0.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        id: naga-cache
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ runner.os }}-${{ env.NAGA_VERSION }}
      - name: Install naga-cli
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --locked --version "$NAGA_VERSION"
      - name: Install glslangValidator
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends glslang-tools
      - run: npm ci
      # Dumps every WGSL/GLSL variant the app can build (shaderBindings.test.ts)
      # and validates each one: the WGSL validator Node cannot run otherwise.
      - run: node scripts/validate-shaders.mjs --require-glslang

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [guard]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Coverage is reported, not gated (#226): no threshold yet.
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('coverage/index.html') != '' }}
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

  e2e:
    name: Playwright E2E (WebGL)
    runs-on: ubuntu-latest
    needs: [web]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright WebGL specs
        run: npx playwright test --project=chromium
        env:
          CI: true

  e2e-webgpu:
    name: Playwright E2E (WebGPU)
    runs-on: ubuntu-latest
    needs: [web]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright WebGPU smoke
        run: npx playwright test --project=chromium-webgpu
        env:
          CI: true

  headless:
    name: Headless renderer (Dawn)
    runs-on: ubuntu-latest
    needs: [guard]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # No GPU on the runner: Dawn draws on Mesa's lavapipe, and on the
      # SwiftShader Vulkan beside Playwright's Chromium for the pinned goldens
      # (docs/HEADLESS.md § Which rasterizer).
      - name: Install Vulkan (lavapipe) and ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers ffmpeg
      - run: npm ci
      - name: Install Playwright Chromium (for its SwiftShader Vulkan)
        run: npx playwright install chromium
      - run: npm run test:gpu
      - name: CLI smoke
        run: |
          npx chromashift render examples/cr0p.json --image examples/sweep.png --frames 90 --out headless-out/cr0p.mp4
          frames=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 headless-out/cr0p.mp4)
          test "$frames" = 90 || { echo "expected 90 frames, got $frames"; exit 1; }
          npx chromashift still examples/cr0p.json --image examples/sweep.png --out headless-out/cr0p.png
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('headless-out/**') != '' }}
        with:
          name: headless-out
          path: headless-out/
          retention-days: 14

  e2e-webgpu-browsers:
    name: Playwright E2E (WebGPU, ${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    needs: [web]
    timeout-minutes: 20
    # Non-blocking until green twice (#228): a red run here does not fail CI.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each where its browser ships WebGPU: Firefox 141+ on Windows,
          # Safari 26's WebKit on macOS. Playwright's Linux builds expose no
          # navigator.gpu, so there every test would skip.
          - browser: firefox
            os: windows-latest
          - browser: webkit
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run the WebGPU smoke and executor specs
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
