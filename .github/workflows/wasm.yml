name: C++ / WASM

# The only workflow that builds or tests the C++ engine (ci.yml has no WASM job).
# Path-filtered to everything that feeds the engine or its committed artifacts:
# the sources, the shared tables and their codegen, and the bench that gates it.
on:
  push:
    paths:
      - 'cpp/**'
      - 'shared/*.json'
      - 'scripts/codegen-*.mjs'
      - 'scripts/bench-wasm.mjs'
      - 'scripts/gen-compile-commands.mjs'
      - 'scripts/check-compile-commands.mjs'
      - 'public/chromashift_engine.*'
      - 'public/wasm-benchmark-core.mjs'
      - '.github/workflows/wasm.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'shared/*.json'
      - 'scripts/codegen-*.mjs'
      - 'scripts/bench-wasm.mjs'
      - 'scripts/gen-compile-commands.mjs'
      - 'scripts/check-compile-commands.mjs'
      - 'public/chromashift_engine.*'
      - 'public/wasm-benchmark-core.mjs'
      - '.github/workflows/wasm.yml'

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # -Werror, so a new conversion / unused-parameter warning fails the job
      # rather than scrolling past. Every engine compile shares the same flags
      # (CXXFLAGS_COMMON in cpp/Makefile).
      - name: Host-side C++ unit tests (-Werror)
        run: npm run test:cpp:werror

  wasm:
    name: WASM build, SIMD tests, freshness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Single source of truth for the toolchain version. Committed
      # public/chromashift_engine.* are only reproducible for a pinned emsdk,
      # which is what the staleness check at the end of this job relies on.
      - name: Read pinned emsdk version
        id: emsdk
        run: echo "version=$(cat cpp/emsdk.version)" >> "$GITHUB_OUTPUT"

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.emsdk.outputs.version }}
          cache: true

      - name: Verify the installed emsdk matches the pin
        run: make -C cpp check

      - name: Verify export list matches header
        run: make -C cpp verify-exports

      # The host job above never compiles a SIMD128 block. This runs the whole
      # host suite against the em++ -msimd128 build, then the bit-exact
      # SIMD-vs-scalar parity harness (cpp/tests/simd_parity.cpp), both -Werror.
      - name: SIMD128 tests + SIMD/scalar parity (-Werror)
        run: npm run test:cpp:simd

      # clangd reads cpp/compile_commands.json (gitignored — absolute paths), so
      # nothing else notices when it drifts from the build. Runs after the SIMD
      # step so emcc has populated the sysroot the wasm32 entries point at.
      # --require-wasm: this job has the pinned emsdk, so an entry that could not
      # be emitted as wasm32 + -msimd128 is a failure here, not a quiet fallback.
      - name: compile_commands.json covers every TU, with the build's flags
        run: |
          emcc_path="$(readlink -f "$(command -v emcc)")"
          export EMSDK="${EMSDK:-$(dirname "$(dirname "$(dirname "$emcc_path")")")}"
          make -C cpp compile-commands
          npm run check:compile-commands -- --require-wasm

      # Force a clean recompile. Plain `make release` is a no-op when committed
      # public/chromashift_engine.* are newer than cpp sources (or share equal
      # checkout mtimes), which silently skips the freshness check.
      - name: Rebuild WASM from scratch
        run: npm run build:wasm:force

      - name: WASM kernel throughput gate
        run: npm run bench:wasm -- --assert

      # build:wasm:force runs codegen first, so this also catches a
      # cpp/*_table.h that is stale against shared/*.json.
      - name: Fail if committed WASM artifacts or generated tables are stale
        run: |
          if ! git diff --exit-code -- public/chromashift_engine.js public/chromashift_engine.wasm 'cpp/*_table.h'; then
            echo "::error::Generated files are out of date. Run 'npm run build:wasm:force' and commit public/chromashift_engine.{js,wasm} and cpp/*_table.h."
            exit 1
          fi
